<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTFS triage report</title>
<style>
:root { color-scheme: light dark; --fg: #1b1b1b; --bg: #ffffff; --muted: #5f5f5f; --line: #d8d8d8; --head: #f2f2f2; }
@media (prefers-color-scheme: dark) { :root { --fg: #e6e6e6; --bg: #161616; --muted: #a0a0a0; --line: #3a3a3a; --head: #222222; } }
body { margin: 0 auto; max-width: 1400px; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
h1 { font-size: 1.4em; } h2 { font-size: 1.15em; margin-top: 2em; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--head); position: sticky; top: 0; }
td.path, td.mono, pre { font-family: ui-monospace, monospace; word-break: break-all; }
pre { white-space: pre-wrap; margin: 4px 0; }
.level { font-weight: 600; text-transform: uppercase; white-space: nowrap; }
.level-critical { color: #b00020; } .level-high { color: #c45100; }
.muted, footer { color: var(--muted); }
footer { margin-top: 3em; border-top: 1px solid var(--line); padding-top: 8px; }
</style>
</head>
<body>
<h1>NTFS triage report</h1>
<noscript><p>This report needs JavaScript to display its data. It makes no network requests.</p></noscript>
<p class="muted">All times are UTC. Findings are the Sigma rules each file matched, ordered by level, then time; they are listed, never scored.</p>
<div id="app"></div>
<footer>
<p>Generated by <span id="version"></span> (commit <span id="commit"></span>). License: <span id="license"></span>. Source: <span id="source"></span>.</p>
<p>Rule matches show each rule's author as required by the Detection Rule License (DRL) 1.1.</p>
</footer>
<script type="application/octet-stream" id="data">__REPORT_DATA__</script>
<script>
__VIEWER__</script>
</body>
</html>
