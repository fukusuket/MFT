<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTFS triage report</title>
<style>
:root { color-scheme: light dark; --fg: #1b1b1b; --bg: #ffffff; --muted: #5f5f5f; --line: #d8d8d8; --head: #f2f2f2; }
@media (prefers-color-scheme: dark) { :root { --fg: #e6e6e6; --bg: #161616; --muted: #a0a0a0; --line: #3a3a3a; --head: #222222; } }
body { margin: 0 auto; max-width: 1400px; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
h1 { font-size: 1.4em; } h2 { font-size: 1.15em; margin-top: 2em; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--head); position: sticky; top: 0; }
td.path, td.mono, pre { font-family: ui-monospace, monospace; word-break: break-all; }
pre { white-space: pre-wrap; margin: 4px 0; }
.level { font-weight: 600; text-transform: uppercase; white-space: nowrap; }
.level-critical { color: #b00020; } .level-high { color: #c45100; }
.muted, footer { color: var(--muted); }
footer { margin-top: 3em; border-top: 1px solid var(--line); padding-top: 8px; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 1em 0; }
.tab { border-bottom: none; border-radius: 4px 4px 0 0; padding: 6px 14px; }
.tab.selected { background: var(--head); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 8px; }
.filters input, .filters select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.filters input.invalid { border-color: #b00020; }
.count { margin: 4px 0; } .folders { display: flex; flex-wrap: wrap; gap: 6px; }
[data-screen="findings"] { --cols: 7em 17em minmax(12em, 1fr) 8em minmax(10em, 18em); }
[data-screen="outside"] { --cols: 17em minmax(12em, 1fr) 6em; }
.list-head, .line { display: grid; grid-template-columns: var(--cols); gap: 8px; }
.list-head { background: var(--head); font-weight: 600; padding: 4px 8px; }
.viewport { height: 60vh; overflow: auto; border: 1px solid var(--line); }
.spacer { position: relative; } .block { position: absolute; left: 0; right: 0; }
.row { box-sizing: border-box; overflow: hidden; padding: 2px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
.line span, .facts { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts { font-size: 0.85em; color: var(--muted); }
.detail { margin-top: 8px; border: 1px solid var(--line); padding: 8px; }
.mono, .path { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<h1>NTFS triage report</h1>
<noscript><p>This report needs JavaScript to display its data. It makes no network requests.</p></noscript>
<p class="muted">All times are UTC. Findings are the Sigma rules each file matched, ordered by level, then time; they are listed, never scored.</p>
<div id="app"></div>
<footer>
<p>Generated by <span id="version"></span> (commit <span id="commit"></span>). License: <span id="license"></span>. Source: <span id="source"></span>.</p>
<p>Rule matches show each rule's author as required by the Detection Rule License (DRL) 1.1.</p>
</footer>
<script type="application/octet-stream" id="data">__REPORT_DATA__</script>
<script>
__VIEWER__</script>
</body>
</html>
