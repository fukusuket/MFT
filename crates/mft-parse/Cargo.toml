[package]
name = "mft-parse"
description = "Raw $MFT records to entries and per-record diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ntfs-types = { path = "../ntfs-types" }
# ADR 0004: pinned commit until a release contains lossless names (PR #147).
mft = { git = "https://github.com/omerbenamram/mft", rev = "18b6c05dcff93e9f5ea6a7c4ec743a88a95dddb4", default-features = false }
thiserror = "=2.0.21" # ADR 0010

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] } # ADR 0008

[lints]
workspace = true
