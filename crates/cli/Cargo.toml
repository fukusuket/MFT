[package]
name = "cli"
description = "Command-line entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tool" # placeholder until the tool is named (product.md §7)
path = "src/main.rs"

[dependencies]
analyze = { path = "../analyze" }
baseline = { path = "../baseline" }
mft-parse = { path = "../mft-parse" }
report = { path = "../report" }
anyhow = "=1.0.104" # ADR 0010
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] } # ADR 0010

[lints]
workspace = true
