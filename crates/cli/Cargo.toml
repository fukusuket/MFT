[package]
name = "cli"
description = "Command-line entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "mozu"
path = "src/main.rs"

[dependencies]
analyze = { path = "../analyze" }
baseline = { path = "../baseline" }
detect = { path = "../detect" }
mft-parse = { path = "../mft-parse" }
ntfs-types = { path = "../ntfs-types" }
report = { path = "../report" }
sigma = { path = "../sigma" }
usn-parse = { path = "../usn-parse" }
anyhow = "=1.0.104" # ADR 0010
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] } # ADR 0010

[target.'cfg(windows)'.dependencies]
collector = { path = "../collector" }

[dev-dependencies]
serde_json = "=1.0.151" # ADR 0010

[lints]
workspace = true
