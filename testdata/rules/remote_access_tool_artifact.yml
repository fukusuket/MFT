# Sample rule for tests. Detection Rule License (DRL) 1.1.
title: Remote access tool file
id: 7cab92a6-2da4-4251-9f74-7ec5808d34c7
status: test
description: A file of a remote monitoring and management (RMM) or remote desktop tool. Legitimate in some organizations; attackers install them for persistent access.
author: tool
date: 2026-10-09
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains:
      - '\ateraAgent'
      - '\Atera Networks\'
      - '\Splashtop'
      - '\AnyDesk'
      - '\ScreenConnect'
      - '\TeamViewer'
      - '\RustDesk'
  condition: selection
level: medium
