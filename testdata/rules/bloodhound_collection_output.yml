# Sample rule for tests. Detection Rule License (DRL) 1.1.
title: BloodHound / SharpHound collection output
id: bf961869-9432-455b-851e-ea7e9aecea9a
status: test
description: A file named like SharpHound output (Active Directory reconnaissance for BloodHound), using its default names.
author: tool
date: 2026-10-09
logsource:
  product: windows
  category: file_event
detection:
  zip:
    TargetFilename|endswith: '_BloodHound.zip'
  json:
    TargetFilename|re|i: '\\\d{14}_(computers|users|groups|domains|gpos|ous|containers)\.json$'
  condition: zip or json
level: high
