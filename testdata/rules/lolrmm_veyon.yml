title: 'Veyon file (LOLRMM)'
id: 30beaf25-baf5-8516-891a-03718e924927
status: test
description: 'A file of Veyon, a remote access tool (RAT) listed by LOLRMM.'
references:
  - https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project (generated by tool)
date: 2026-10-06
logsource:
  product: windows
  category: file_event
detection:
  exact:
    TargetFilename:
      - 'C:\\Windows\\Temp\\VeyonServer.log'
      - 'C:\\Windows\\Temp\\VeyonService.log'
  starting:
    TargetFilename|startswith:
      - 'C:\\Program Files (x86)\\Veyon\\'
      - 'C:\\Program Files\\Veyon\\'
  ending:
    TargetFilename|endswith:
      - '\\veyon-master.exe'
      - '\\veyon-server.exe'
      - '\\veyon-service.exe'
      - '\\veyon-wcli.exe'
      - '\\veyon-worker.exe'
  glob1:
    TargetFilename: 'C:\\Users\\*\\AppData\\Local\\VeyonCLI.log'
    TargetFilename|contains: '\\AppData\\Local\\VeyonCLI.log'
  condition: 1 of them
level: medium
