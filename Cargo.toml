[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "fuzz"]  # Phase 0 spikes; fuzz/ is its own workspace (ADR 0013)

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Never panic on untrusted input (evidence files). See AGENTS.md.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
# Catch arithmetic overflow in parsers.
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

# ADR 0014: mft @ 18b6c05 can overflow while decoding data runs (unused by mft-parse).
# Wrap instead of panic in that crate only; our crates keep overflow checks.
[profile.release.package.mft]
overflow-checks = false

[profile.dev.package.mft]
opt-level = 2
overflow-checks = false
