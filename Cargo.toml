[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# 信頼できない入力（証拠ファイル）でpanicしないための規約（AGENTS.md「unsafeとpanic」）
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
# パーサーの算術オーバーフローを見逃さない
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
