[package]
name = "s1-rsigma"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 0 spike S1: rsigma-eval on NTFS-shaped events (throwaway)"

# Standalone: excluded from the main workspace (Cargo.toml `exclude = ["spikes"]`).
[workspace]

[dependencies]
# Approved for this spike (H2, 2026-10-04): default features off to avoid tree-sitter (C build).
rsigma-eval = { version = "=0.23.0", default-features = false }
rsigma-parser = { version = "=0.23.0", default-features = false }
serde_json = "1"
