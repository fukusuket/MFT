[package]
name = "s4-baseline"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 0 spike S4: outside-baseline ratio of real $MFT files vs VanillaWindowsReference (throwaway)"

# Standalone: excluded from the main workspace (Cargo.toml `exclude = ["spikes"]`).
[workspace]

[dependencies]
# Same pinned commit as spike S2 / ADR 0004. No new dependencies: HashSet instead of fst
# (identical set semantics; fst is a Phase 1 H2 decision).
mft = { git = "https://github.com/omerbenamram/mft", rev = "18b6c05dcff93e9f5ea6a7c4ec743a88a95dddb4", default-features = false }
